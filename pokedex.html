
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <!-- Importation des style Bootstrap et CSS. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="./styles.css" rel="stylesheet" type="text/css">
    <!-- Importation des style Bootstrap et CSS. -->
    <script src="./scripts/pokedex.js" type="module"></script>
    <!-- Empêche une erreur. Ça se passe parce qu'on a pas d'icon. -->
    <link rel="icon" href="data:,">
</head>

<body>
    <header class="over-top-bar">
        <div>Vann Sovannthanant & Samuel Lacombe</div>
        <div>26/09/2026 - 25/09/2026</div>
    </header>

    <nav class="top-bar">
        <a class="index" href="index.html" style="text-decoration: none">Introduction au projet</a>
        <a class="pokedex" href="pokedex.html" style="text-decoration: none">Visiter Pokedex</a>
        <a class="formulaire" href="creation.html" style="text-decoration: none">Ajouter nouveau Pokemon</a>
    </nav>

    <div class="arrierePlanCentral">
        <div class="planCentral">
            <h1>Visiter le Pokedex</h1>
            <p>Ici se trouve tous les pokémons du Pokedex, elle contient 30 Pokemons: </p>

            <div class="carteAfficher ms-5 me-5" id="carteAfficher">
                <div class="row row-cols-2">
                    <div>
                        <h2 id="nomAfficher"></h2>
                        <img id="imageAfficher" class="mb-3" style="width: 100%;">
                        <p id="pointVieAfficher"></p>
                        <p id="attaqueAfficher"></p>
                        <p id="defenceAfficher"></p>
                        <p id="vitesseAfficher"></p>
                        <button id="btnSuppression" type="button" class="btn btn-danger">Suprimer le pokemon</button>
                    </div>
                    <div>
                        <h2 id="idAfficher" class="text-end"></h2>
                        <p id="descriptionAfficher"></p>

                        <div class="containerTypes border-5 border-top border-end border-warning mb-2 p-2">
                            <p>Types:</p>
                            <div id="typesAfficher"></div>
                        </div>

                        <div class="containerFaiblesses border-5 border-top border-end border-danger mb-2 p-2">
                            <p>Faiblesses:</p>
                            <div id="faiblessesAfficher"></div>
                        </div>

                        <div class="containerResistances border-5 border-top border-end border-primary mb-2 p-2">
                            <p>Résistances:</p>
                            <div id="resistancesesAfficher"></div>
                        </div>

                        <p id="tailleAfficher"></p>
                        <p id="poidsAfficher"></p>
                    </div>
                </div>
            </div>

            <form class="hstack mt-3 mb-3" role="search" id="formulaireRecherche">
                <input class="form-control" style="width:30%;" id="recherche" type="search" aria-label="Recherche" placeholder="Rechercher un pokemon">
            </form>

            <div class="row row-cols-5" id="ChampPokemon"> <!-- Ici seront insérer les carte.--> </div>

        </div>
    </div>
    
    <div class="affichageModal" id="modal">
        <div class="boiteModal">
            <h3>Supprimer</h3>
            <p>Voulez vous vraiment supprimer:</p>
            <button id="btnAnnuler">Annuler</button>
            <button id="btnConfirmer">Confirmer</button>
        </div>
    </div>

</body>
</html>
