
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <!-- Importation des style Bootstrap et CSS. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="./styles.css" rel="stylesheet" type="text/css">
    <!-- Importation des style Bootstrap et CSS. -->
    <script src="./scripts/pokedex.js" type="module"></script>
    <!-- Empêche une erreur. Ça se passe parce qu'on a pas d'icon. -->
    <link rel="icon" href="data:,">
</head>

<body>
    <header class="over-top-bar">
        <div>Vann Sovannthanant & Samuel Lacombe</div>
        <div>26/09/2026 - </div>
    </header>

    <nav class="top-bar">
        <a class="index" href="index.html" style="text-decoration: none">Projet Personel</a>
        <a class="pokedex" href="pokedex.html" style="text-decoration: none">Visiter le Pokedex</a>
        <a class="formulaire" href="creation.html" style="text-decoration: none">Entrer un Pokemon</a>
        <a class="parametre" href="parametre.html" style="text-decoration: none">Paramètre</a>
    </nav>

    <div class="arrierePlanCentral">
        <div class="planCentral ps-1 pe-1 pt-3">
            <h1 class="ms-4">Visiter le Pokedex</h1>
            <p class="ms-4">Ici se trouve tous les pokémons du Pokedex: </p>

            <div class="border border-secondary">
                <card class="card border border-primary pe-5 ps-5 pt-3 pb-3" style="width: 70%; margin: auto;">
                    <h2 id="nomAfficher">Cliquer sur un pokemon.</h2>
                    <div class="row row-cols-2">
                        <div>
                            <img id="imageAfficher" class="border border-success" style="width: 100%;">
                            <p id="pointVieAfficher"></p>
                            <p id="attaqueAfficher"></p>
                            <p id="defenceAfficher"></p>
                            <p id="vitesseAfficher"></p>
                        </div>
                        <div>
                            <p id="descriptionAfficher"></p>
                            <ol id="typesAfficher">
                            <!-- On insère les types choisis.-->
                            </ol>
                            <p id="tailleAfficher"></p>
                            <p id="poidsAfficher"></p>
                        </div>
                    </div>
                </card>
            </div>

            <form class="ms-4 m-3" id="formulaireRecherche">
                <input class="form-control" style="width:20%;" id="recherche" type="Search" name="Recherche" placeholder="Rechercher un pokemon">
            </form>

            <div class="row row-cols-5 ms-4 me-4" id="ChampPokemon">
                <!--Ici seront insérer les carte.-->
            </div>
        </div>

    </div>

</body>
</html>
