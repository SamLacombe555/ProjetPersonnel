
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Pokémon</title>
    <link href="../Stylisation/stylesIndex.css" rel="stylesheet">
</head>

<body>
    <!-- ===== Début de l'en-tête ===== -->
    <div class= "containerHeader">
        <section class="over-top-bar">
            <div>Connexion</div>
            <div>Recherche</div>
        </section>
    </div>

    <header>
        <div class="containerHeader">
            <section class = "top-bar">
                <a class="index" href="../index.html" style="text-decoration: none">Projet Personel</a>
                <a class="pokedex" href="pokedex.html" style="text-decoration: none">Visiter le Pokedex</a>
                <a class="formulaire" href="creation.html" style="text-decoration: none">Entrer un Pokemon</a>
                <div>Projet Personel</div>
            </section>
        </div>
    </header>
    <!-- ===== Fin de l'en-tête ===== -->

    <div class="arrierePlanCentral">
        <section class="containerCentral">
            <h1>Create a New Pokémon</h1>
            <form  method="post">
                
                <section id="cr-nom">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required><br><br>
                </section>

                <section id="cr-type">
                    <ul>
                        <li> <label> Normal<input type="checkbox" name="normal" value="normal"></label></li>
                        <li> <label> Fire<input type="checkbox" name="fire" value="fire"></label></li>
                        <li> <label> Water<input type="checkbox" name="water" value="water"></label></li>
                        <li> <label> Electric<input type="checkbox" name="electric" value="electric"></label></li>
                        <li> <label> Grass<input type="checkbox" name="grass" value="grass"></label></li>
                        <li> <label> Ice<input type="checkbox" name="ice" value="ice"></label></li>
                        <li> <label> Fighting<input type="checkbox" name="fighting" value="fighting"></label></li>
                        <li> <label> Poison<input type="checkbox" name="poison" value="poison"></label></li>
                        <li> <label> Ground<input type="checkbox" name="ground" value="ground"></label></li>
                        <li> <label> Flying<input type="checkbox" name="flying" value="flying"></label></li>
                        <li> <label> Psychic<input type="checkbox" name="psychic" value="psychic"></label></li>
                        <li> <label> Bug<input type="checkbox" name="bug" value="bug"></label></li>
                        <li> <label> Rock<input type="checkbox" name="rock" value="rock"></label></li>
                        <li> <label> Ghost<input type="checkbox" name="ghost" value="ghost"></label></li>
                        <li> <label> Dragon<input type="checkbox" name="dragon" value="dragon"></label></li>
                        <li> <label> Dark<input type="checkbox" name="dark" value="dark"></label></li>
                        <li> <label> Steel<input type="checkbox" name="steel" value="steel"></label></li>
                        <li> <label> Fairy<input type="checkbox" name="fairy" value="fairy"></label></li>

                    </ul>
                </section>

                <label for="niveau">Niveau :</label>
                <input type="number" id="niveau" name="niveau" min="1" max="100" required><br><br>

                <input type="submit" value="Créer">
            </form>
        </section>
    </div>
    
</body>
</html>
