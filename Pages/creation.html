
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Pokémon</title>
    <!-- Ne pas oublier de faire ../ pour les fichiers qui se trouvent dans des fichiers. -->
    <link href="../Stylisation/stylescreation.css" rel="stylesheet">
</head>

<body>
    <!-- Le "header" et la div "ContainerTopBar" sert à ajouté une entête.-->
    <header>
        <div class = "containerTopBar">
            <section class = "top-bar">
                <a class ="index" href="../index.html" style="text-decoration: none">Pokemon</a>
                <a class ="pokedex" href="pokedex.html" style="text-decoration: none">Pokedex</a>
                <a class ="formulaire" href="creation.html" style="text-decoration: none">Entrer Pokemon</a>
                <div>Projet Personel</div>
            </section>
        </div>
    </header>

    <section>
        <h1>Créer un nouveau Pokémon</h1>
        <form  method="post">
            <section id="cr-nom">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" required><br><br>
            </section>

            <section id="cr-type">
                <label for="type">Type :</label>
                <input type="text" id="type" name="type" required><br><br>
            </section>

            <label for="niveau">Niveau :</label>
            <input type="number" id="niveau" name="niveau" min="1" max="100" required><br><br>

            <input type="submit" value="Créer">
        </form>

</body>
</html>
