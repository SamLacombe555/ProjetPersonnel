
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Pokémon</title>
    <!-- Importation des style Bootstrap et CSS. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="./styles.css" rel="stylesheet" type="text/css">
    <!-- Importation des style Bootstrap et CSS. -->
    <script src="./scripts/creation.js" type="module"></script>
</head>

<body>
    <header class="over-top-bar">
        <div>Vann Sovannthanant & Samuel Lacombe</div>
        <div>26/09/2026 - </div>
    </header>

    <nav class = "top-bar">
        <a class="index" href="index.html" style="text-decoration: none">Projet Personel</a>
        <a class="pokedex" href="pokedex.html" style="text-decoration: none">Visiter le Pokedex</a>
        <a class="formulaire" href="creation.html" style="text-decoration: none">Entrer un Pokemon</a>
        <a class="parametre" href="parametre.html" style="text-decoration: none">Paramètre</a>
    </nav>

    <div class ="arrierePlanCentral">
        <div class="row">
            <div class="col-8 border border-primary">
                <h1>Créer un nouveau Pokémon</h1>
                <p>Les Pokémons créer ici seront envoyés dans le programme principale et seront affichés
                    dane le Pokédex.</p>
                <form id="formulairePokemon">         
                    <div class="row">
                        <div class="col-6 p-4 border border-success">    
                            <div class="mb-3">
                                <label class="form-label" for="nom">Nom :</label>
                                <input class="form-control" id="nom" type="text" name="nom" required>
                            </div>
                            
                            <label class="form-label" for="niveau">Choisissez un niveau (Min 1 et max 100):</label>
                            <input class="form-control" style="width: 25%;" type="number" id="niveau" min="1" max="100" value="1" required>

                            <label class="form-label" for="pointVie">Quantifiez le point de vie (Min 1 et max 700):</label>
                            <input class="form-control" style="width: 25%;" type="number" id="pointVie" min="1" max="700" value="100" required>

                            <label class="form-label" for="attaque">Quantifiez l'attaque (Min 1 et max 200):</label>
                            <input class="form-control" style="width: 25%;" type="number" id="attaque" min="1" max="200" value="10" required>

                            <label class="form-label" for="defence">Quantifiez la défence (Min 1 et max 250):</label>
                            <input class="form-control" style="width: 25%;" type="number" id="defence" min="1" max="250" value="15" required>

                            <label class="form-label" for="vitesse">Quantifiez la vitesse (Min 1 et max 200):</label>
                            <input class="form-control" style="width: 25%;" type="number" id="vitesse" min="1" max="200" value="10" required>
                        </div>

                        <div class="col-6 p-4 border border-warning" id="containerType">
                            <!-- On peut ajouter jusqu'a trois types. -->
                            <div class="mb-3">
                                <label class="form-label" for="selectType1">Choisissez un type:</label>
                                <select class="form-select" id="selectType1" name="selectTypeChoisi1">
                                    <!-- On insère les types depuis JavaScript. -->
                                </select>
                            </div>

                            <button class="btn btn-warning" type="button" id="AjouterType">Ajouter un autre type</button> 
                        </div>
                    </div>

                    <button class="btn btn-warning" type="submit" id="Validation">Créer</button>
                </form>
            </div>
                
            <div class="col-4 border border-secondary">
                <h1>Aperçu de la carte</h1>
                <div class="p-3">
                    <card class="card border border-primary p-2">
                        <h2 id="nomApercu">NomApercu</h3>
                        <p id="niveauApercu">0</p>
                        <p id="pointVieApercu">0</p>
                        <p id="attaqueApercu">0</p>
                        <p id="defenceApercu">0</p>
                        <p id="vitesseApercu">0</p>
                        <ol>
                            <!-- On insère les types choisis.-->
                        </ol>
                    </card>
                </div>
            </div>

        </div>
    </div>
    
</body>
</html>
